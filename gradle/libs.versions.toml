[versions]
# Kotlin / Compose
kotlin = "2.3.20"
ksp = "2.3.7"
agp = "9.1.1"
composeMultiplatform = "1.10.3"
composeCompiler = "2.3.20"

# AndroidX / Lifecycle / Navigation
coreKtx = "1.15.0"
activityCompose = "1.9.3"
lifecycle = "2.10.0"
navigationCompose = "2.9.7"
composeBom = "2025.04.00"

# Room KMP + SQLite driver (stable!)
room = "2.8.3"
sqlite = "2.6.0"

# Ktor
ktor = "3.4.3"

# Kotlinx
serialization = "1.8.0"
coroutines = "1.10.1"
datetime = "0.7.0"

# Koin
koin = "4.2.0"

# SKIE
skie = "0.10.11"

# MOKO Resources
moko = "0.26.2"

# Logging
napier = "2.7.1"

# SDK Android — AGP 9.1 targets API 37
minSdk = "26"
compileSdk = "37"
targetSdk = "37"

[libraries]
# Kotlinx
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

# Lifecycle / ViewModel multiplatform (JB fork)
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Android
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Jetpack Compose (Android — via BOM)
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }

# Room KMP
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

# Ktor
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-contentneg = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# MOKO
moko-resources = { module = "dev.icerock.moko:resources", version.ref = "moko" }
moko-resources-compose = { module = "dev.icerock.moko:resources-compose", version.ref = "moko" }

# Logging
napier = { module = "io.github.aakira:napier", version.ref = "napier" }

# Classpaths pour build-logic
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "composeCompiler" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
room-gradle-plugin = { module = "androidx.room:room-gradle-plugin", version.ref = "room" }
moko-resources-gradle-plugin = { module = "dev.icerock.moko:resources-generator", version.ref = "moko" }
skie-gradle-plugin = { module = "co.touchlab.skie:plugin", version.ref = "skie" }
kotlin-serialization-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }

[plugins]
kotlinMultiplatform   = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidApplication    = { id = "com.android.application", version.ref = "agp" }
androidLibrary        = { id = "com.android.library", version.ref = "agp" }
androidKmpLibrary     = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeMultiplatform  = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "composeCompiler" }
kotlinSerialization   = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                   = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room                  = { id = "androidx.room", version.ref = "room" }
skie                  = { id = "co.touchlab.skie", version.ref = "skie" }
moko-resources        = { id = "dev.icerock.mobile.multiplatform-resources", version.ref = "moko" }

# Convention plugins (résolus via build-logic)
tummy-kmp-library     = { id = "tummy.kmp.library" }
tummy-kmp-feature     = { id = "tummy.kmp.feature" }
tummy-kmp-room        = { id = "tummy.kmp.room" }
tummy-kmp-moko        = { id = "tummy.kmp.moko" }
tummy-android-app     = { id = "tummy.android.app" }
