name: iosApp
options:
  bundleIdPrefix: com.tummy
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en

# xcconfig wired as the base configuration for both schemes.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO        # Run Script Phase needs filesystem access for Gradle
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp                          # contains TummyApp.swift, DI/, Navigation/, Screens/, Tokens/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tummy.ios
        # Output binary is Tummy.app. The Xcode target itself stays `iosApp`
        # (the `targets:` key in this YAML), so scheme and folder are
        # unchanged — only the binary and CFBundleName are renamed.
        PRODUCT_NAME: Tummy
        # CFBundleDisplayName (under the icon, app switcher, system dialogs).
        # CFBundleName is auto-derived from PRODUCT_NAME, so already "Tummy".
        INFOPLIST_KEY_CFBundleDisplayName: Tummy
        # Info.plist auto-generated by Xcode (no physical file to maintain).
        GENERATE_INFOPLIST_FILE: YES
        # Enables an empty UILaunchScreen → iOS renders the app fullscreen on
        # all modern devices. Without it, iOS letterboxes (black top/bottom bars).
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Supported orientations (otherwise Xcode may warn / iOS may force portrait).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Linker must see TummyShared (produced by embedAndSignAppleFrameworkForXcode).
        OTHER_LDFLAGS: "$(inherited) -framework TummyShared"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    # Build Phase Run Script that calls Gradle to produce + embed + sign TummyShared.framework.
    # Must run before Compile Sources.
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false      # always run, otherwise Xcode sometimes skips it
        script: |
          set -e
          cd "$SRCROOT/.."
          ./gradlew :umbrella:embedAndSignAppleFrameworkForXcode

          # MOKO resources: the static framework doesn't auto-embed the MOKO
          # bundle. We copy it from the :core:ui-tokens klib into the .app,
          # where NSBundle(identifier:) will find it via CFBundleIdentifier.
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            if [ "$ARCHS" = "arm64" ]; then MOKO_TARGET="iosSimulatorArm64"
            else MOKO_TARGET="iosX64"; fi
          else
            MOKO_TARGET="iosArm64"
          fi
          MOKO_SRC="$SRCROOT/../core/ui-tokens/build/classes/kotlin/$MOKO_TARGET/main/klib/ui-tokens/default/resources"
          MOKO_DST="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH"
          if [ -d "$MOKO_SRC" ]; then
            for bundle in "$MOKO_SRC"/*.bundle; do
              [ -d "$bundle" ] || continue
              name=$(basename "$bundle" | tr ':' '_')
              rm -rf "$MOKO_DST/$name"
              cp -R "$bundle" "$MOKO_DST/$name"
            done
          fi
