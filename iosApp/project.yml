name: iosApp
options:
  bundleIdPrefix: com.tummy
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en

# Config xcconfig branchée comme base configuration sur les 2 schemes.
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig

# Settings au niveau projet.
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO        # Run Script Phase a besoin du FS pour Gradle
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"

targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: iosApp                          # le dossier qui contient TummyApp.swift, DI/, Navigation/, Screens/, Tokens/
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tummy.ios
        # Le binaire produit s'appelle Tummy.app. Le target Xcode lui-même
        # reste `iosApp` (clé `targets:` du YAML), donc le scheme et le folder
        # restent inchangés. Seul le binaire et CFBundleName sont impactés.
        PRODUCT_NAME: Tummy
        # CFBundleDisplayName (sous l'icône, app switcher, dialogues système).
        # CFBundleName est auto-dérivé de PRODUCT_NAME, donc déjà "Tummy".
        INFOPLIST_KEY_CFBundleDisplayName: Tummy
        # Info.plist auto-généré par Xcode (pas de fichier physique à maintenir).
        GENERATE_INFOPLIST_FILE: YES
        # Active une UILaunchScreen vide → iOS rend l'app plein écran sur tous
        # les devices modernes. Sans ça, iOS letterbox (bandes noires haut/bas).
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Orientations supportées (sinon Xcode peut warn / iOS limite à portrait).
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Le linker doit voir TummyShared (produit par embedAndSignAppleFrameworkForXcode)
        OTHER_LDFLAGS: "$(inherited) -framework TummyShared"
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
    # Build Phase Run Script qui appelle Gradle pour produire + embed + signer TummyShared.framework.
    # Doit s'exécuter avant Compile Sources.
    preBuildScripts:
      - name: Build Kotlin framework
        basedOnDependencyAnalysis: false      # toujours run, sinon Xcode skip parfois
        script: |
          cd "$SRCROOT/.."
          ./gradlew :umbrella:embedAndSignAppleFrameworkForXcode
